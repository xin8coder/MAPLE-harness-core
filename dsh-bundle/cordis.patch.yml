# This bundle bridges public-data preparation, asynchronous solving, silent
# waiting, inspection, and result export without modifying paper entrypoints.
# The Python command is installed separately so paper experiment entrypoints stay untouched.
- id: agent-default-model
  config:
    provider: deepseek-official
    model: deepseek-flash

- id: locale
  config:
    preference: zh

- id: system-prompt
  config:
    includeHarnessIdentity: false
    personaPrefix: >-
      你是 MAPLE 优化助手，帮助用户导入数据、明确目标与约束、生成优化方案、
      调整已有需求并比较和导出结果。默认使用简体中文，不自称编程助手或 LiveOpt。

# Retain the existing preset id so saved conversations get the MAPLE workflow
# without rewriting their history. Only optimization and clarification tools
# are exposed, not a general-purpose coding environment.
- id: preset-standard
  config:
    id: standard
    name: MAPLE 优化助手
    description: 导入数据、优化求解、更新需求和比较方案
    order: 1
    plugins:
      - id: persona
        name: '@deepseek-ai/dsh-persona'
        config:
          prefix: >-
            你是 MAPLE 优化助手。帮助用户把自然语言和上传的数据转化为优化任务，
            通过 MAPLE 工具获得真实方案，支持后续需求调整、方案比较与结果导出。
            默认使用简体中文。你不是通用编程助手，不提供软件开发、终端或系统管理服务。
      - id: time-context
        name: '@deepseek-ai/dsh-time-context'
      - id: tool-skill
        name: '@deepseek-ai/dsh-tool-skill'
      - id: tool-ask-user
        name: '@deepseek-ai/dsh-tool-ask-user'
      - id: compaction
        name: cordis:group
        group: true
        isolate:
          compaction: true
          toolResultPruner: true
        config:
          - id: compaction-basic
            name: '@deepseek-ai/dsh-compaction-basic'
          - id: tool-result-pruner
            name: '@deepseek-ai/dsh-compaction-tool-result-pruner'
            config:
              thresholdChars: 8192
              headChars: 4096
              tailChars: 1024

- id: preset-ptc
  disabled: true

- id: preset-minimal
  disabled: true

- id: preset-cordis
  disabled: true

- id: harness-dev-context
  disabled: true

- id: tool-working-directory
  disabled: true

- id: mcp-resources
  disabled: true

- id: ui-sidebar-terminal
  disabled: true

- id: ui-goal
  disabled: true

- id: ui-schedule
  disabled: true

- id: ui-subagent
  disabled: true

- id: ui-model-selection
  disabled: true

- id: ui-settings-models
  disabled: true

# MAPLE exposes one application mode. Solver choice remains a request field
# rather than a host-agent mode selector.
- id: ui-agent-preset
  disabled: true

- id: ui-permission
  disabled: true

- id: ui-plan
  disabled: true

# Keep the settings shell (it is packaged with the General section), while
# replacing host plugin inventory pages with the focused LiveOpt section.
- id: ui-settings-plugin-inventory
  disabled: true

- id: ui-settings-plugins
  disabled: true

- id: ui-plugin-manager
  disabled: true

# LiveOpt owns the application identity. DeepSeek Harness attribution remains
# available from the About dialog instead of occupying the primary brand slots.
- id: ui-brand-official
  disabled: true

- insert:
    - id: liveopt-mcp
      name: '@deepseek-ai/dsh-mcp-client'
      config:
        serverName: liveopt
        transport: stdio
        command: !!js process.env.LIVEOPT_MCP_COMMAND ?? `${process.env.HOME}/.local/bin/liveopt-mcp`
        args: ['--transport', 'stdio']
        cwd: !!js process.env.LIVEOPT_MCP_WORKSPACE_ROOT ?? process.cwd()
        env:
          PYTHONUNBUFFERED: '1'
          DEEPSEEK_API_KEY: !!js process.env.DEEPSEEK_API_KEY ?? ''
          DEEPSEEK_MODEL: 'deepseek-flash'
          DEEPSEEK_BASE_URL: !!js process.env.DEEPSEEK_BASE_URL ?? 'https://api.deepseek.com/v1'
          KIMI_API_KEY: !!js process.env.KIMI_API_KEY ?? ''
          KIMI_MODEL: !!js process.env.KIMI_MODEL ?? 'k3[1m]'
          KIMI_BASE_URL: !!js process.env.KIMI_BASE_URL ?? 'https://api.kimi.com/coding/v1'
          LLM_PROVIDER: !!js process.env.LLM_PROVIDER ?? 'deepseek'
          LIVEOPT_MCP_STATE_DIR: !!js process.env.LIVEOPT_MCP_STATE_DIR ?? `${process.env.HOME}/.local/share/liveopt-dsh/state`
          LIVEOPT_MCP_WORKSPACE_ROOT: !!js process.env.LIVEOPT_MCP_WORKSPACE_ROOT ?? process.cwd()
          LIVEOPT_MCP_CACHE_MODE: !!js process.env.LIVEOPT_MCP_CACHE_MODE ?? 'read_write'
          LIVEOPT_MCP_NETWORK_MODE: !!js process.env.LIVEOPT_MCP_NETWORK_MODE ?? 'auto'
          LIVEOPT_MCP_MAX_WORKERS: !!js process.env.LIVEOPT_MCP_MAX_WORKERS ?? '2'
          LIVEOPT_MCP_DEFAULT_MODEL: 'deepseek-flash'
          LIVEOPT_MCP_SOLVER_TIME_LIMIT_SECONDS: !!js process.env.LIVEOPT_MCP_SOLVER_TIME_LIMIT_SECONDS ?? '30'
        # liveopt_wait intentionally holds one tool call while the browser card
        # reads progress from the local sidecar API. The model remains silent.
        toolCallTimeoutMs: 3600000
        failOnStartupError: true
        reconnect:
          enabled: true
          initialDelayMs: 500
          maxDelayMs: 30000
          maxAttempts: 10

    - id: liveopt-skill
      name: liveopt-dsh-bundle
      inject: [skills, systemPrompt, settings]

    - id: maple-web-bridge
      name: liveopt-dsh-bundle/web-bridge
