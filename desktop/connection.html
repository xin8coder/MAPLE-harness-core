<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self'; connect-src 'none'; object-src 'none'; base-uri 'none'">
  <title>MAPLE Harness</title>
  <link rel="stylesheet" href="connection.css">
</head>
<body>
  <main>
    <header><img src="icon.png" alt="" width="56" height="56"><div><h1>MAPLE Harness</h1><p id="subtitle">Desktop</p></div></header>
    <form id="connection">
      <label for="language" id="language-label">Language</label>
      <select id="language"><option value="en">English</option><option value="zh">简体中文</option></select>
      <label for="server" id="server-label">Server address</label>
      <input id="server" type="url" placeholder="https://192.168.1.100:3000" required autocomplete="url" autofocus>
      <p id="status" role="status" aria-live="polite"></p>
      <button id="connect" type="submit">Connect</button>
    </form>
  </main>
  <script src="connection.js"></script>
</body>
</html>
