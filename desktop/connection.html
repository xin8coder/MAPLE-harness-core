<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self'; connect-src 'none'; object-src 'none'; base-uri 'none'">
  <title>澜筹·通用运筹智能体</title>
  <link rel="stylesheet" href="connection.css">
</head>
<body>
  <main>
    <header><img src="icon.png" alt="" width="56" height="56"><div><h1 id="brand-name">澜筹</h1><p id="subtitle">通用运筹智能体</p></div></header>
    <form id="connection">
      <label for="language" id="language-label">启动窗口语言</label>
      <select id="language"><option value="en">English</option><option value="zh" selected>简体中文</option></select>
      <label for="server" id="server-label">服务器地址或首次连接链接</label>
      <input id="server" type="url" placeholder="https://192.168.1.100:3000" required autocomplete="url" autofocus>
      <p id="status" role="status" aria-live="polite"></p>
      <button id="connect" type="submit">连接</button>
    </form>
  </main>
  <script src="connection.js"></script>
</body>
</html>
